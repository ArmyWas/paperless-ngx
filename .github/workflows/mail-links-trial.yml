name: Mail links isolated trial
on:
  push:
    branches:
      - feat/mail-document-links
    paths:
      - scripts/mail-links-trial/**
      - .github/workflows/mail-links-trial.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      COMPOSE_FILE: scripts/mail-links-trial/compose.yaml
      COMPOSE_PROJECT_NAME: paperless-mail-links-trial
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate isolated configuration
        run: docker compose config --quiet
      - name: Make room on the disposable hosted runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build trial image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: paperless-mail-links-trial:local
          build-args: PNGX_TAG_VERSION=feature-mail-links-trial
          cache-from: type=gha,scope=mail-links-trial
          cache-to: type=gha,mode=max,scope=mail-links-trial
      - name: Start isolated instance
        run: docker compose up -d --no-build --wait --wait-timeout 300
      - name: Import synthetic mail and verify document links
        timeout-minutes: 15
        run: docker compose exec -T webserver python3 /trial/smoke.py
      - name: Show service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=250
      - name: Remove disposable instance
        if: always()
        run: docker compose down --volumes
